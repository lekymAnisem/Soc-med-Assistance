{{- if .Values.secrets.externalSecret.enabled }}
{{- $secretName := .Values.secrets.existingSecretName | default .Values.global.existingSecretName | default (printf "%s-secrets" (include "nova.fullname" .)) }}
{{- $eso := .Values.secrets.externalSecret }}
---
# Syncs real credentials from AWS Secrets Manager into the cluster Secret
# using the External Secrets Operator (IRSA: role nova-external-secrets).
# Both resources are Argo CD PreSync hooks so the synced Secret is available
# before the database migration Job hook (weight -5) runs.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $eso.storeName }}
  labels: {{ include "nova.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-weight": "-15"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $eso.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $eso.serviceAccountName }}
            namespace: {{ $eso.serviceAccountNamespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "nova.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-weight": "-10"
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $eso.storeName }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # The app database is Neon (serverless Postgres) — this is the
        # connection string the backend + migration job use.
        DATABASE_URL: {{ "{{ .DATABASE_URL }}" | quote }}
        # AI provider keys (OpenRouter/OpenAI gateway)
        AI_PROVIDER: {{ "{{ .AI_PROVIDER }}" | quote }}
        OPENROUTER_API_KEY: {{ "{{ .OPENROUTER_API_KEY }}" | quote }}
        OPENROUTER_MODEL: {{ "{{ .OPENROUTER_MODEL }}" | quote }}
        # Cloudinary media storage credentials
        CLOUDINARY_CLOUD_NAME: {{ "{{ .CLOUDINARY_CLOUD_NAME }}" | quote }}
        CLOUDINARY_API_KEY: {{ "{{ .CLOUDINARY_API_KEY }}" | quote }}
        CLOUDINARY_API_SECRET: {{ "{{ .CLOUDINARY_API_SECRET }}" | quote }}
        # Clerk auth
        CLERK_SECRET_KEY: {{ "{{ .CLERK_SECRET_KEY }}" | quote }}
        VITE_CLERK_PUBLISHABLE_KEY: {{ "{{ .VITE_CLERK_PUBLISHABLE_KEY }}" | quote }}
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: DATABASE_URL
    - secretKey: AI_PROVIDER
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: AI_PROVIDER
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: OPENROUTER_API_KEY
    - secretKey: OPENROUTER_MODEL
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: OPENROUTER_MODEL
    - secretKey: CLOUDINARY_CLOUD_NAME
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLOUDINARY_CLOUD_NAME
    - secretKey: CLOUDINARY_API_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLOUDINARY_API_KEY
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLOUDINARY_API_SECRET
    - secretKey: CLERK_SECRET_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLERK_SECRET_KEY
    - secretKey: VITE_CLERK_PUBLISHABLE_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: VITE_CLERK_PUBLISHABLE_KEY
{{- end }}

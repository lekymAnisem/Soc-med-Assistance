apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.configMapName | default (printf "%s-config" (include "nova.fullname" .)) }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "nova.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: "{{ $value }}"
  {{- end }}
---
# Nginx config for the frontend (SPA fallback + API proxy is handled by ingress)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: {{ .Values.namespace }}
  labels: {{ include "nova.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_types text/plain text/css application/json application/javascript image/svg+xml;
      gzip_min_length 256;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
    }

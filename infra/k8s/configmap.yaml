apiVersion: v1
kind: ConfigMap
metadata:
  name: nova-config
  namespace: nova
  labels:
    app.kubernetes.io/name: nova
data:
  # Backend
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ORIGIN: "*"
  AI_PROVIDER: openrouter
  OPENROUTER_MODEL: nvidia/nemotron-3-super-120b-a12b:free
  # Clerk — public, safe in a ConfigMap
  VITE_CLERK_PUBLISHABLE_KEY: pk_test_...
  # Frontend proxy target
  BACKEND_SERVICE: backend
---
# Nginx config for the frontend static site (SPA fallback)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nova-frontend-nginx
  namespace: nova
  labels:
    app.kubernetes.io/name: nova
data:
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_types text/plain text/css application/json application/javascript image/svg+xml;
      gzip_min_length 256;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
    }
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nova
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: nova
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
        - name: api
          image: nova-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: nova-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: OPENROUTER_API_KEY
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: AI_PROVIDER
            - name: OPENROUTER_MODEL
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: OPENROUTER_MODEL
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: CLOUDINARY_API_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nova-aws-secrets-manager
  labels:
    app.kubernetes.io/name: nova
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nova-secrets
  namespace: nova
  labels:
    app.kubernetes.io/name: nova
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nova-aws-secrets-manager
  target:
    name: nova-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        AI_PROVIDER: "{{ .AI_PROVIDER }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
        OPENROUTER_MODEL: "{{ .OPENROUTER_MODEL }}"
        CLOUDINARY_CLOUD_NAME: "{{ .CLOUDINARY_CLOUD_NAME }}"
        CLOUDINARY_API_KEY: "{{ .CLOUDINARY_API_KEY }}"
        CLOUDINARY_API_SECRET: "{{ .CLOUDINARY_API_SECRET }}"
        VITE_CLERK_PUBLISHABLE_KEY: "{{ .VITE_CLERK_PUBLISHABLE_KEY }}"  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: nova-secrets
        property: DATABASE_URL
    - secretKey: AI_PROVIDER
      remoteRef:
        key: nova-secrets
        property: AI_PROVIDER
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: nova-secrets
        property: OPENROUTER_API_KEY
    - secretKey: OPENROUTER_MODEL
      remoteRef:
        key: nova-secrets
        property: OPENROUTER_MODEL
    - secretKey: CLOUDINARY_CLOUD_NAME
      remoteRef:
        key: nova-secrets
        property: CLOUDINARY_CLOUD_NAME
    - secretKey: CLOUDINARY_API_KEY
      remoteRef:
        key: nova-secrets
        property: CLOUDINARY_API_KEY
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: nova-secrets
        property: CLOUDINARY_API_SECRET
    - secretKey: VITE_CLERK_PUBLISHABLE_KEY
      remoteRef:
        key: nova-secrets
        property: VITE_CLERK_PUBLISHABLE_KEY